<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connection lost</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #09090b;
    color: #f4f4f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    max-width: 360px;
    padding: 28px 24px;
    text-align: center;
  }
  .icon {
    font-size: 40px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 8px;
  }
  p {
    font-size: 13px;
    line-height: 1.5;
    color: #a1a1aa;
    margin: 0 0 20px;
  }
  button {
    appearance: none;
    border: none;
    border-radius: 10px;
    background: #38bdf8;
    color: #09090b;
    font-size: 14px;
    font-weight: 700;
    padding: 11px 22px;
    cursor: pointer;
  }
  button:active {
    opacity: 0.85;
  }
  .hint {
    margin-top: 14px;
    font-size: 11px;
    color: #71717a;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Connection lost</h1>
    <!-- Deliberately no cached prices/positions/signals here -- this is a live-trading
         dashboard, so a fake "offline" view with stale data would be actively
         misleading. This page shows nothing but the honest fact that the connection
         dropped and a way to retry, same principle as sw.js's own doc comment. -->
    <p>The dashboard couldn't reach the server. This is usually a brief mobile network drop -- check your connection and try again.</p>
    <button onclick="location.reload()">Reload</button>
    <div class="hint">No trading data is shown here -- only the live dashboard is ever real.</div>
  </div>
</body>
</html>
